<!DOCTYPE html>
<html>
<head>
    <title>Offline</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        h1 { color: #333; }
        p { color: #666; }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0069d9; }
    </style>
</head>
<body>
    <h1>Estás Offline</h1>
    <p>Algunos contenidos quizás no estén disponibles.</p>
    <p>Páginas que has visitado antes deberían de funcionar.</p>
    <p>（◞‿◟）</p>
    <button onclick="window.location.href='/'">Volver al inicio</button>
    <button onclick="window.location.reload()">Reintentar conexión</button>
</body>
</html>
