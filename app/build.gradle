plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'com.google.protobuf' version '0.9.4' // Add this explicitly
    id 'idea'

}

version = '1.0-SNAPSHOT'

ext{
    openapi = "6.1.3"

}

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

application {
    // Define the main class for the application.
    mainClass = 'practica.Main'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    //maven { url 'https://repo.kotlin.link' }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    //JAVALIN DEPENDENCIES
    implementation 'io.javalin:javalin:6.4.0'
    implementation 'org.slf4j:slf4j-simple:2.0.11'
    implementation 'io.javalin:javalin-rendering:6.1.3'


    //THYMELEAF PLANTILLA
    implementation 'org.thymeleaf:thymeleaf:3.1.1.RELEASE'

    //KOTLIN USAGE
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'

    //JSON FOR JAVALIN
    implementation("com.fasterxml.jackson.core:jackson-core:2.15.2")
    implementation('com.fasterxml.jackson.core:jackson-databind:2.15.2')
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.15.2")

    //ORM HIBERNATE
    implementation 'org.hibernate.orm:hibernate-core:6.0.2.Final'

    //H2 CONNECTION
    implementation 'com.h2database:h2:2.1.214'
    implementation 'org.postgresql:postgresql:42.3.8'

    // OpenAPI
    annotationProcessor "io.javalin.community.openapi:openapi-annotation-processor:$openapi"
    implementation "io.javalin.community.openapi:javalin-openapi-plugin:$openapi" // for /openapi route with JSON scheme
    implementation "io.javalin.community.openapi:javalin-swagger-plugin:$openapi" // for Swagger UI
    implementation "io.javalin.community.openapi:javalin-redoc-plugin:$openapi" // for ReDoc UI
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3' // or latest version

    //mongoDB
    implementation group: 'org.mongodb', name: 'mongodb-driver-sync', version: '4.10.2'

    //for sending preview
    implementation 'org.seleniumhq.selenium:selenium-java:4.20.0'
    implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.20.0'

    //Libreria para JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    //GRPC
    runtimeOnly 'io.grpc:grpc-netty-shaded:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'io.grpc:grpc-services:1.62.2' // Para habilitar la reflexión del servidor https://github.com/grpc/grpc-java/blob/master/documentation/server-reflection-tutorial.md#enable-server-reflection
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // necessary for Java 9+
    implementation 'com.google.protobuf:protobuf-java:3.25.3'

}

    
shadowJar{
    archiveBaseName.set("app")
    archiveClassifier.set('')
    archiveVersion.set('')
}


    //Tareas para la generación del código.
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.1"
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }

    //generatedFilesBaseDir = "$projectDir/generated"
}

clean {
    delete protobuf.generatedFilesBaseDir
}


idea {
    module {
        sourceDirs += file("src/generated");
    }
}

task stage {
    dependsOn shadowJar
}
