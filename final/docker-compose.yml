version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000"  # HTTP port
      - "5000:5000"  # gRPC port
    environment:
      - PORT=7000
      - GRPC_PORT=5000
      - MONGODB_URL=${MONGODB_URL}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
